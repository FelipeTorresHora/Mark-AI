[project]
name = "mark-ai-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "psycopg2-binary",
  "psycopg[binary]",
  "pydantic[email]",
  "pydantic-settings",
  "openai",
  "langgraph",
  "langchain-openai",
  "langsmith",
  "langgraph-checkpoint-postgres",
  "httpx",
  "alembic",
  "loguru",
  "bcrypt",
  "python-jose[cryptography]",
  "resend",
  "apscheduler>=3.10",
  "pytz",
]

[tool.vercel]
entrypoint = "src.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
exclude = ["alembic"]
