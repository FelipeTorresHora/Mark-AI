name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketing_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketing_ci
      JWT_SECRET_KEY: test-secret-key
      SOCIAL_TOKEN_ENCRYPTION_KEY: test-social-token-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy api/index.py src/config.py src/main.py

      - name: Test
        run: python -m pytest

  # Single required check for branch protection (see .github/REQUIRED_CHECKS.md).
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
    if: always()
    steps:
      - name: Enforce lint, typecheck, and tests
        run: |
          frontend="${{ needs.frontend-ci.result }}"
          backend="${{ needs.backend-ci.result }}"
          echo "Frontend CI: $frontend"
          echo "Backend CI: $backend"
          if [ "$frontend" != "success" ] || [ "$backend" != "success" ]; then
            echo "::error::Quality gate failed. Fix eslint/ruff, tsc/mypy, or vitest/pytest before merge."
            exit 1
          fi
          echo "Quality gate passed."

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend-ci
      - backend-ci
    outputs:
      skip: ${{ steps.deploy_prereq.outputs.skip }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: deploy_prereq
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Vercel secrets are not configured. Quality checks still block bad merges."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.deploy_prereq.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build backend
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy backend
        id: deploy
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" 2>/dev/null | tail -n 1)
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend-ci
      - backend-ci
      - deploy-backend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_API_URL: ${{ needs.deploy-backend.outputs.deployment_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: deploy_prereq
        env:
          BACKEND_SKIP: ${{ needs.deploy-backend.outputs.skip }}
        run: |
          if [ "$BACKEND_SKIP" = "true" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Vercel deploy was skipped (missing secrets or backend deploy skipped)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.deploy_prereq.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build frontend
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy frontend
        if: steps.deploy_prereq.outputs.skip != 'true'
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
